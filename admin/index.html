<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VMA GPA Calculator — Admin</title><style>*{box-sizing:border-box}body{max-width:850px;margin:48px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#17181c}.panel{background:#fff;border:1px solid #e7e7ed;border-radius:16px;padding:24px}h1{margin-top:0;font-size:26px}p{color:#666;line-height:1.55}.label{display:block;font-size:13px;color:#666;margin:14px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}textarea{min-height:390px}button{margin-top:14px;border:0;border-radius:9px;padding:11px 15px;background:#17181c;color:#fff;font-weight:650;cursor:pointer}.secondary{background:#fff;color:#17181c;border:1px solid #ddd;margin-left:7px}.hidden{display:none}.status{font-size:13px;min-height:20px}.ok{color:#176b3a}.error{color:#b42318}</style></head><body><h1>VMA GPA Calculator</h1><div class="panel" id="login"><h2>Course database admin</h2><p>Enter the administrator password to update the shared course catalogue.</p><label class="label" for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password"><button onclick="signIn()">Sign in</button><p id="loginStatus" class="status"></p></div><div class="panel hidden" id="editor"><h2>Course database</h2><p>Edit the JSON carefully. Use <code>null</code> for PSHE credits.</p><label class="label" for="data">Courses</label><textarea id="data" spellcheck="false"></textarea><button onclick="publish()">Save and publish</button><button class="secondary" onclick="signOut()">Sign out</button><p id="editorStatus" class="status"></p></div><script>let token="";const $=id=>document.getElementById(id),set=(id,text,kind="")=>{const e=$(id);e.textContent=text;e.className="status "+kind};async function signIn(){token=$("password").value;set("loginStatus","Checking…");try{const r=await fetch("/api/admin/session",{method:"POST",headers:{authorization:"Bearer "+token}});if(!r.ok)throw new Error();const courses=await (await fetch("/api/courses")).json();$("data").value=JSON.stringify(courses,null,2);$("login").classList.add("hidden");$("editor").classList.remove("hidden")}catch(_){token="";set("loginStatus","Incorrect password or unavailable API.","error")}}async function publish(){let courses;try{courses=JSON.parse($("data").value)}catch(_){set("editorStatus","The course data is not valid JSON.","error");return}set("editorStatus","Publishing…");try{const r=await fetch("/api/admin/courses",{method:"PUT",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify(courses)}),result=await r.json();if(!r.ok)throw new Error(result.error||"Could not save.");set("editorStatus",`Published ${result.updated} courses.`,"ok")}catch(e){set("editorStatus",e.message,"error")}}function signOut(){token="";$("password").value="";$("editor").classList.add("hidden");$("login").classList.remove("hidden");set("loginStatus","")}</script></body></html>
